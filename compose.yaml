name: cricketops

x-app-source-volumes: &app-source-volumes
  - ./client:/app/client
  - ./config:/app/config
  - ./engine:/app/engine
  - ./scripts:/app/scripts
  - ./server:/app/server
  - ./package.json:/app/package.json:ro
  - ./package-lock.json:/app/package-lock.json:ro
  - node_modules:/app/node_modules

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      app:
        condition: service_started
      certs:
        condition: service_completed_successfully
    ports:
      - "3333:80"
      - "3443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/nginx/certs:ro
    networks:
      - public_net
      - app_net
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev
    environment:
      PORT: "3333"
      NODE_ENV: development
      TRUST_PROXY: "1"
      FFMPEG_PATH: /usr/bin/ffmpeg
      DATABASE_URL: postgres://${POSTGRES_USER:-icat}:${POSTGRES_PASSWORD:-icat_local}@postgres:5432/${POSTGRES_DB:-icat_cricket}
      ACCEPT_DATABASE_URL: postgres://${POSTGRES_USER:-icat}:${POSTGRES_PASSWORD:-icat_local}@postgres:5432/${POSTGRES_TEST_DB:-icat_cricket_test}
      PUBLIC_HTTP_ORIGIN: ${PUBLIC_HTTP_ORIGIN:-http://localhost:3333}
      PUBLIC_HTTPS_ORIGIN: ${PUBLIC_HTTPS_ORIGIN:-https://localhost:3443}
    expose:
      - "3333"
    volumes: *app-source-volumes
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app_net
      - db_net
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-icat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-icat_local}
      POSTGRES_DB: ${POSTGRES_DB:-icat_cricket}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-icat_cricket_test}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - db_net
    restart: unless-stopped

  certs:
    build:
      context: ./docker/certs
    environment:
      LAN_IP: ${LAN_IP:-127.0.0.1}
      DNS_NAMES: ${DNS_NAMES:-localhost,cricketops.local}
    volumes:
      - certs:/certs
    network_mode: none

  tools:
    image: python:3.12-slim
    profiles: ["tools"]
    working_dir: /workspace
    command: sh -lc "python -m venv /venv && . /venv/bin/activate && python --version && tail -f /dev/null"
    environment:
      VIRTUAL_ENV: /venv
      PATH: /venv/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      DATABASE_URL: postgres://${POSTGRES_USER:-icat}:${POSTGRES_PASSWORD:-icat_local}@postgres:5432/${POSTGRES_DB:-icat_cricket}
    volumes:
      - .:/workspace
      - python_venv:/venv
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tools_net
      - db_net

  test:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["test"]
    command: npm test
    environment:
      NODE_ENV: test
      PORT: "3333"
      ACCEPT_DATABASE_URL: postgres://${POSTGRES_USER:-icat}:${POSTGRES_PASSWORD:-icat_local}@postgres:5432/${POSTGRES_TEST_DB:-icat_cricket_test}
      DATABASE_URL: postgres://${POSTGRES_USER:-icat}:${POSTGRES_PASSWORD:-icat_local}@postgres:5432/${POSTGRES_TEST_DB:-icat_cricket_test}
      FFMPEG_PATH: /usr/bin/ffmpeg
      PUBLIC_HTTP_ORIGIN: http://localhost:3333
      PUBLIC_HTTPS_ORIGIN: https://localhost:3443
    volumes: *app-source-volumes
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tools_net
      - db_net

  db-debug:
    image: postgres:16-alpine
    profiles: ["debug"]
    command: tail -f /dev/null
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-icat}
      PGPASSWORD: ${POSTGRES_PASSWORD:-icat_local}
      PGDATABASE: ${POSTGRES_DB:-icat_cricket}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db_net

networks:
  public_net:
  app_net:
  db_net:
    internal: true
  tools_net:
    internal: true

volumes:
  node_modules:
  postgres_data:
  certs:
  python_venv:

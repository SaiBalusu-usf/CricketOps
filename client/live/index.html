<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Live scorecard — ICAT Cricket Live</title>
  <link rel="icon" href="/client/icons/icon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/client/shared/base.css">
  <link rel="stylesheet" href="/client/live/live.css">
</head>
<body class="livepage">
  <header id="brandbar">
    <a class="bb-brand" href="/">
      <img id="bbLogo" alt="" hidden>
      <span id="bbName">ICAT</span>
      <span class="bb-sub">Your cricket, live</span>
    </a>
    <nav class="bb-nav">
      <a href="/matches">Live matches</a>
      <a href="/" class="bb-cta">Score a match</a>
    </nav>
  </header>

  <div id="offline" class="offline-strip" hidden>Reconnecting…</div>

  <div id="layout">
    <main id="colMain">
      <section id="matchCard" class="card mcard">
        <div class="mc-top">
          <span id="matchLabel" class="mc-label">Match</span>
          <span class="mc-actions">
            <span id="livePill" class="live-pill" hidden><span class="dot"></span>Live</span>
            <button id="shareBtn" class="icon-round" title="Share" aria-label="Share">&#8599;</button>
            <button id="qrBtn" class="icon-round" title="QR code" aria-label="QR code">&#9638;</button>
          </span>
        </div>
        <div id="mcMeta" class="mc-meta"></div>
        <div id="mcToss" class="mc-toss"></div>
        <div id="teamRows" class="team-rows"></div>
        <a id="mWatch" class="m-watch" href="#videoCard" hidden>&#9654; Watch the live stream</a>
      </section>

      <nav id="tabs" class="tabs">
        <button data-tab="live" class="on">Live</button>
        <button data-tab="scorecard">Scorecard</button>
        <button data-tab="commentary">Commentary</button>
        <button data-tab="overs">Analysis</button>
        <button data-tab="teams">Teams</button>
      </nav>

      <section id="tab-live" class="tabpanel card"></section>
      <section id="tab-scorecard" class="tabpanel card" hidden></section>
      <section id="tab-commentary" class="tabpanel card" hidden></section>
      <section id="tab-overs" class="tabpanel card" hidden></section>
      <section id="tab-teams" class="tabpanel card" hidden></section>
    </main>

    <aside id="colSide">
      <section id="videoCard" class="card side-card"></section>
      <section id="rrCard" class="card side-card"></section>
      <section id="detailsCard" class="card side-card"></section>
    </aside>
  </div>

  <div id="qrModal" class="qr-modal" hidden>
    <div class="qr-box">
      <img id="qrImg" alt="QR code for this page">
      <p class="small muted">Scan to open this live scorecard</p>
      <button id="qrClose" class="btn primary">Close</button>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="/client/live/live.js"></script>
</body>
</html>
